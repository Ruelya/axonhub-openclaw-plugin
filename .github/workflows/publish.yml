name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate manifest
        run: npm run validate:manifest

      - name: Run tests
        run: |
          npm run test:reasoning-profile
          npm run test:e2e

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare ClawPack output directory
        run: mkdir -p ./clawpack-out

      - name: Pack ClawPack artifact
        run: npm pack --pack-destination ./clawpack-out

      - name: Upload ClawPack artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawpack-${{ github.ref_name }}
          path: ./clawpack-out/*.tgz
          retention-days: 90

      - name: Publish to ClawHub
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "CLAWHUB_TOKEN is not set; skipping ClawHub publish."
            exit 0
          fi
          npx clawhub publish --clawpack ./clawpack-out/*.tgz
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
